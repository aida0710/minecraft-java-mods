<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary.en | default: 'Minecraft Java Edition mods for Forge, NeoForge and Fabric' }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  {% if page.icon %}<link rel="icon" href="{{ page.icon | relative_url }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script src="{{ '/assets/js/lang.js' | relative_url }}"></script>
</head>
<body>
  <header class="topbar">
    <a class="topbar-home" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="topbar-actions">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="mc-button mc-button--small" data-set-lang="ja">日本語</button>
        <button type="button" class="mc-button mc-button--small" data-set-lang="en">English</button>
      </div>
      <a class="mc-button mc-button--small" href="https://github.com/{{ site.repository }}">GitHub</a>
    </nav>
  </header>

  {{ content }}

  <footer class="footer">
    <p data-lang="ja">© aida0710。Minecraft の公式製品ではありません。Mojang および Microsoft とは関係がありません。</p>
    <p data-lang="en">© aida0710. Not an official Minecraft product. Not approved by or associated with Mojang or Microsoft.</p>
  </footer>
</body>
</html>
