name: Build

on:
  push:
    branches: [main]
    tags: ['chat-translator-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chat-translator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-translator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Verify jar contents
        run: |
          JAR=$(ls build/libs/chattranslator-*.jar | grep -v -- '-slim' | head -1)
          echo "jar=$JAR"
          unzip -l "$JAR" | grep -q 'com/aida0710/chattranslator/ChatTranslator.class'
          unzip -l "$JAR" | grep -q 'com/aida0710/chattranslator/shadow/kotlin/Unit.class'
          if unzip -l "$JAR" | grep -E ' kotlin/' ; then echo 'unrelocated kotlin classes found'; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: chattranslator
          path: |
            chat-translator/build/libs/*.jar
            !chat-translator/build/libs/*-slim.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/chat-translator-v')
        uses: softprops/action-gh-release@v3
        with:
          files: chat-translator/build/libs/chattranslator-*[0-9].jar
