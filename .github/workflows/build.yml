name: Build

on:
  push:
    branches: [main]
    tags: ['chat-translator-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chat-translator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-translator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 最後に書いた版が JAVA_HOME になる。JDK 8 は ForgeGradle 用 (次の次の手順)
          java-version: |
            8
            25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ForgeGradle は JDK 8 が無いと GitHub から取るが、Actions では接続の待ち時間切れで続けて失敗することがある
      # (2026-11-05 に 3 回続けて失敗)。自分のキャッシュの中の <名前>/bin/java を JDK として探すので、ダウンロードせずに済むよう置いておく
      - name: Let ForgeGradle use the JDK 8 from setup-java
        run: |
          MAVENIZER_CACHE="$HOME/.gradle/caches/minecraftforge/forgegradle/mavenizer/caches"
          mkdir -p "$MAVENIZER_CACHE"
          ln -sfn "$JAVA_HOME_8_X64" "$MAVENIZER_CACHE/temurin-8-from-setup-java"

      # タグの版と gradle.properties の mod_version が違うと、別の版の jar を配ってしまうので先に止める
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/chat-translator-v')
        run: |
          VERSION=${GITHUB_REF_NAME#chat-translator-v}
          grep -qx "mod_version=$VERSION" gradle.properties || { echo "tag $GITHUB_REF_NAME does not match mod_version in gradle.properties"; exit 1; }
          test -f release-notes/$VERSION.md || { echo "missing release-notes/$VERSION.md"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Verify jar contents
        run: |
          for LOADER in forge neoforge fabric; do
            JAR=$(ls $LOADER/build/libs/chattranslator-$LOADER-*.jar | grep -v -- '-slim' | head -1)
            echo "jar=$JAR"
            case $LOADER in
              forge) METADATA="META-INF/mods.toml META-INF/accesstransformer.cfg" ;;
              neoforge) METADATA="META-INF/neoforge.mods.toml META-INF/accesstransformer.cfg" ;;
              fabric) METADATA="fabric.mod.json chattranslator.classtweaker" ;;
            esac
            LIST=$(unzip -l "$JAR")
            for f in com/aida0710/chattranslator/ChatTranslator.class com/aida0710/chattranslator/shadow/kotlin/Unit.class com/aida0710/chattranslator/shadow/nightconfig/toml/TomlFormat.class $METADATA assets/chattranslator/icon.png META-INF/LICENSE META-INF/licenses/THIRD-PARTY.txt META-INF/licenses/LGPL-3.0.txt META-INF/licenses/GPL-3.0.txt META-INF/licenses/PLaMo-Community-License-en.txt META-INF/licenses/PLaMo-Community-License-ja.txt assets/chattranslator/python/mlx-requirements.txt assets/chattranslator/python/vllm-requirements.txt assets/chattranslator/lang/en_us.json assets/chattranslator/lang/ja_jp.json assets/chattranslator/lang/zh_cn.json assets/chattranslator/dictionaries/hypixel-skyblock.json; do
              grep -q " $f\$" <<<"$LIST" || { echo "missing $f in $JAR"; exit 1; }
            done
            if grep -E ' (kotlin|org/intellij|org/jetbrains|com/electronwill)/' <<<"$LIST"; then echo "unrelocated or unwanted classes found in $JAR"; exit 1; fi
            if unzip -p "$JAR" META-INF/licenses/THIRD-PARTY.txt | grep -F '${'; then echo "library versions are not filled in THIRD-PARTY.txt of $JAR"; exit 1; fi
          done
          unzip -p fabric/build/libs/chattranslator-fabric-*[0-9].jar fabric.mod.json | python3 -m json.tool > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: chattranslator
          path: |
            chat-translator/*/build/libs/chattranslator-*.jar
            !chat-translator/*/build/libs/*-slim.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/chat-translator-v')
        uses: softprops/action-gh-release@v3
        with:
          name: Chat Translator ${{ env.VERSION }}
          body_path: chat-translator/release-notes/${{ env.VERSION }}.md
          files: chat-translator/*/build/libs/chattranslator-*[0-9].jar
