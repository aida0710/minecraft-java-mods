clientSideOnly=true

[[mods]]
modId="chattranslator"
version="${mod_version}"
displayName="Chat Translator"
authors="aida0710"
displayURL="https://github.com/aida0710/minecraft-forge-mods"
description='''
Translates chat and item tooltips with a built-in LLM (llama.cpp + TranslateGemma) or Claude / DeepL / Google / OpenAI-compatible APIs.
チャットとアイテムの説明文を翻訳します (日本語 / English / 简体中文 UI)。
'''

[[dependencies.chattranslator]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.chattranslator]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
