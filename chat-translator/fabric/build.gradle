plugins {
    id 'java'
    // 1.19 は Gradle 9.8 以上が必要なため、ForgeGradle と同じ Gradle 9.7 で動く 1.18 系を使う
    id 'net.fabricmc.fabric-loom' version '1.18.4'
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow'
}

apply from: rootProject.file('gradle/loader.gradle')

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
        content { includeGroup 'com.terraformersmc' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // mod 一覧 (Mod Menu) の「設定」ボタン。入っていなくても動く
    compileOnly 'com.terraformersmc:modmenu:21.0.0'
}

loom {
    // ChatComponent の非公開メンバーを使う (Forge / NeoForge の accesstransformer.cfg と同じ内容)
    accessWidenerPath = file('src/main/resources/chattranslator.classtweaker')

    mods {
        chattranslator {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            runDir 'run'
            // ./gradlew :fabric:runClient -Pselftest=<dir> で自動テスト用に起動する
            if (project.hasProperty('selftest')) property 'chattranslator.selftest', project.property('selftest').toString()
        }
    }
}

// 配布用の jar (ライブラリ同梱済み) を、開発用のクラスフォルダではなく本番と同じ形で起動して確かめる。
// ./gradlew :fabric:runProductionClient -Pselftest=<dir>
configurations {
    productionMods { transitive = false }
}

dependencies {
    productionMods "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

tasks.register('runProductionClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    // 既定では同梱前の jar (remapJar) も足されるため、同梱済みの jar に置き換える
    mods.setFrom(tasks.named('shadowJar'), configurations.productionMods)
    runDir = layout.projectDirectory.dir('run/production')
    // 画面の無い環境では、呼び出す側で xvfb-run を使う
    useXVFB = false
    if (project.hasProperty('selftest')) jvmArgs.add("-Dchattranslator.selftest=${project.property('selftest')}".toString())
}
