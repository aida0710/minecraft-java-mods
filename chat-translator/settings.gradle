pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'chat-translator'

// common: 全ローダーで共有するコード (バニラの Minecraft に対してコンパイルし、単体テストもここで行う)
// forge / neoforge / fabric: 各ローダーの入口。common のソースを取り込んで 1 つの jar にする
include 'common', 'forge', 'neoforge', 'fabric'
